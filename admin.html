<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin — Bon Vivant Joias</title>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
  :root{
    --forest:#1A4430; --forest-deep:#122E20; --gold:#C9A020; --gold-hi:#E0B830;
    --cream:#F7F4EC; --ink:#1A2620; --muted:#5C6B62; --line:#E4E0D4; --err:#c0392b;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Work Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  h1,h2{font-family:'Bodoni Moda',serif;font-weight:500}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit}

  /* ── topbar ── */
  .topbar{background:var(--forest-deep);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;gap:.75rem;flex-wrap:wrap}
  .topbar h1{font-size:1.1rem;color:#fff;white-space:nowrap}
  .topbar h1 em{color:var(--gold);font-style:italic}
  .topbar-actions{display:flex;gap:.5rem;flex-shrink:0}

  /* ── buttons ── */
  .btn{padding:.65rem 1.1rem;border-radius:6px;font-weight:600;font-size:.85rem;border:none;line-height:1;white-space:nowrap;touch-action:manipulation}
  .btn-gold{background:var(--gold);color:var(--forest-deep)}
  .btn-gold:hover{background:var(--gold-hi)}
  .btn-outline{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff}
  .btn-outline:hover{border-color:var(--gold);color:var(--gold)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--forest);color:var(--forest)}

  /* ── login ── */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .login-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:2.25rem 1.75rem;max-width:360px;width:100%}
  .login-box h2{margin-bottom:.4rem;color:var(--forest)}
  .login-box p{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
  .err-msg{color:var(--err);font-size:.82rem;margin-top:.6rem;display:none}
  .err-msg.show{display:block}

  /* ── app layout ── */
  #app{display:none;padding:1.25rem;max-width:1100px;margin:0 auto}
  @media(min-width:640px){#app{padding:2rem}}

  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
  @media(min-width:640px){.panel{padding:1.75rem;margin-bottom:1.75rem}}
  .panel h2{font-size:1.2rem;margin-bottom:1.1rem;color:var(--forest)}
  @media(min-width:640px){.panel h2{font-size:1.3rem;margin-bottom:1.25rem}}

  /* ── form ── */
  .field{margin-bottom:1rem}
  .field label{display:block;font-size:.8rem;font-weight:600;color:var(--forest);margin-bottom:.4rem}
  .field input,.field select{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:6px;font-size:1rem;background:#fff;-webkit-appearance:none}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
  .field-check{display:flex;align-items:center;gap:.5rem;padding:.75rem 0}
  .field-check input[type=checkbox]{width:18px;height:18px;accent-color:var(--forest);flex-shrink:0;cursor:pointer}
  .field-check label{font-size:.9rem;cursor:pointer;user-select:none}
  .form-grid{display:grid;grid-template-columns:1fr;gap:.75rem}
  @media(min-width:560px){.form-grid{grid-template-columns:repeat(2,1fr);gap:1rem 1.25rem}}
  .form-actions{display:flex;gap:.75rem;margin-top:1.25rem;flex-wrap:wrap}
  .form-actions .btn{flex:1 1 auto;text-align:center;min-width:130px}
  @media(min-width:420px){.form-actions .btn{flex:0 0 auto}}
  .upload-preview{width:80px;height:80px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--cream);margin-top:.6rem}
  #cancelBtn{display:none}

  /* ── product list — desktop table ── */
  .products-table-wrap{overflow-x:auto;display:none}
  @media(min-width:640px){.products-table-wrap{display:block}}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:.75rem;border-bottom:1px solid var(--line);font-size:.88rem;vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
  td img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--cream)}
  .thumb-empty{width:44px;height:44px;border-radius:6px;background:var(--forest);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Bodoni Moda',serif;font-style:italic;font-size:1.1rem}
  .row-actions{display:flex;gap:.5rem}
  .icon-btn{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--forest);font-size:.95rem;touch-action:manipulation}
  .icon-btn:hover{border-color:var(--gold);color:var(--gold)}
  .icon-btn.danger:hover{border-color:var(--err);color:var(--err)}
  .badge-featured{background:var(--gold);color:var(--forest-deep);font-size:.68rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;white-space:nowrap}

  /* ── product list — mobile cards ── */
  .products-cards{display:flex;flex-direction:column;gap:.75rem}
  @media(min-width:640px){.products-cards{display:none}}
  .product-card{display:flex;align-items:flex-start;gap:.9rem;padding:.9rem;border:1px solid var(--line);border-radius:10px;background:#fff}
  .product-card + .product-card{border-top:none;margin-top:0}
  .product-card-thumb{flex-shrink:0;width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--cream)}
  .product-card-thumb-empty{flex-shrink:0;width:56px;height:56px;border-radius:8px;background:var(--forest);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Bodoni Moda',serif;font-style:italic;font-size:1.3rem}
  .product-card-info{flex:1;min-width:0}
  .product-card-name{font-weight:600;font-size:.95rem;line-height:1.3;margin-bottom:.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .product-card-meta{font-size:.8rem;color:var(--muted);margin-bottom:.45rem}
  .product-card-price{font-size:.88rem;font-weight:600;color:var(--forest);margin-bottom:.5rem}
  .product-card-actions{display:flex;gap:.5rem;align-items:center}
  .card-action-btn{height:36px;padding:0 .85rem;border-radius:6px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:600;color:var(--forest);touch-action:manipulation;white-space:nowrap}
  .card-action-btn:hover{border-color:var(--gold);color:var(--gold)}
  .card-action-btn.danger:hover{border-color:var(--err);color:var(--err)}
  .card-action-btn i{font-size:.9rem}
  #productsEmpty{text-align:center;color:var(--muted);padding:2rem;display:none}

  /* ── toast ── */
  .toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--forest-deep);color:#fff;padding:.85rem 1.35rem;border-radius:8px;font-size:.88rem;opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.error{background:var(--err)}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>Painel Admin</h2>
    <p>Bon Vivant Joias — acesso restrito</p>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn btn-gold" style="width:100%" onclick="login()">Entrar</button>
    <p class="err-msg" id="loginErr">Senha incorreta.</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="topbar" style="margin-bottom:1.25rem">
    <h1>Bon Vivant <em>Joias</em> — Admin</h1>
    <div class="topbar-actions">
      <a class="btn btn-outline" href="/" target="_blank">Ver site</a>
      <button class="btn btn-outline" onclick="logout()">Sair</button>
    </div>
  </header>

  <!-- FORM -->
  <section class="panel">
    <h2 id="formTitle">Adicionar produto</h2>
    <form id="productForm" onsubmit="return submitProduct(event)">
      <input type="hidden" id="editId" value=""/>
      <div class="form-grid">
        <div class="field">
          <label for="pName">Nome</label>
          <input type="text" id="pName" required placeholder="Ex: Cordão Cartier"/>
        </div>
        <div class="field">
          <label for="pMaterial">Material / descrição</label>
          <input type="text" id="pMaterial" required placeholder="Ex: Ouro 18k · Elos maciços"/>
        </div>
        <div class="field">
          <label for="pCategory">Categoria</label>
          <select id="pCategory">
            <option value="cordao">Cordão</option>
            <option value="anel">Aliança</option>
            <option value="brinco">Brinco</option>
            <option value="pulseira">Pulseira</option>
            <option value="pingente">Pingente</option>
          </select>
        </div>
        <div class="field-check">
          <input type="checkbox" id="pFeatured"/>
          <label for="pFeatured">Destacar em "Mais vendidos"</label>
        </div>
        <div class="field">
          <label for="pPrice">Preço no Pix (R$)</label>
          <input type="number" id="pPrice" required min="0" step="0.01" placeholder="Ex: 990" inputmode="decimal"/>
        </div>
        <div class="field">
          <label for="pOriginalPrice">Preço original / "de" (R$)</label>
          <input type="number" id="pOriginalPrice" min="0" step="0.01" placeholder="Ex: 1190" inputmode="decimal"/>
        </div>
        <div class="field" style="grid-column:1/-1">
          <label for="pImageFile">Foto do produto</label>
          <input type="file" id="pImageFile" accept="image/jpeg,image/png,image/webp" onchange="previewImage(this)" style="width:100%;padding:.5rem 0"/>
          <img id="imgPreview" class="upload-preview" style="display:none"/>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-gold" id="submitBtn">Adicionar produto</button>
        <button type="button" class="btn btn-ghost" onclick="resetForm()" id="cancelBtn">Cancelar edição</button>
      </div>
    </form>
  </section>

  <!-- CONFIGURAÇÕES DO SITE -->
  <section class="panel">
    <h2>Configurações do site</h2>
    <form id="settingsForm" onsubmit="return saveSettings(event)">
      <div class="form-grid">
        <div class="field">
          <label for="sWhatsapp">WhatsApp (só números, com DDD)</label>
          <input type="tel" id="sWhatsapp" inputmode="numeric" placeholder="Ex: 5511999990000"/>
          <small style="color:var(--muted);font-size:.78rem;margin-top:.3rem;display:block">Usado nos botões do site e no link wa.me</small>
        </div>
        <div class="field">
          <label for="sStoreName">Nome da loja</label>
          <input type="text" id="sStoreName" placeholder="Ex: Bon Vivant Joias"/>
        </div>
        <div class="field">
          <label for="sStoreCity">Cidade / localização</label>
          <input type="text" id="sStoreCity" placeholder="Ex: São Paulo · SP"/>
        </div>
        <div class="field">
          <label for="sStoreHours">Horário de atendimento</label>
          <input type="text" id="sStoreHours" placeholder="Ex: Seg–Sex: 9h às 18h"/>
        </div>
        <div class="field">
          <label for="sStoreEmail">E-mail de contato</label>
          <input type="email" id="sStoreEmail" placeholder="Ex: contato@bonvivant.com.br"/>
        </div>
        <div class="field">
          <label for="sInstagram">Link do Instagram (URL completa)</label>
          <input type="url" id="sInstagram" placeholder="Ex: https://instagram.com/bonvivantjoias"/>
        </div>
      </div>
      <div class="form-actions" style="margin-top:1.25rem">
        <button type="submit" class="btn btn-gold" id="settingsSubmitBtn">Salvar configurações</button>
      </div>
    </form>
  </section>

  <!-- LISTA -->
  <section class="panel">
    <h2>Produtos (<span id="productCount">0</span>)</h2>

    <!-- Mobile cards -->
    <div class="products-cards" id="productsCards"></div>
    <p id="productsEmpty">Nenhum produto cadastrado.</p>

    <!-- Desktop table -->
    <div class="products-table-wrap">
      <table>
        <thead>
          <tr><th>Foto</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Destaque</th><th>Ações</th></tr>
        </thead>
        <tbody id="productsTable"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
  let products = [];
  const CAT = { cordao:'Cordão', anel:'Aliança', brinco:'Brinco', pulseira:'Pulseira', pingente:'Pingente' };

  function toast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => { t.className = 'toast'; }, 3000);
  }

  async function checkAuth() {
    try {
      const res = await fetch('/api/admin/check');
      const data = await res.json();
      if (data.authenticated) showApp();
    } catch {}
  }

  function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadProducts();
    loadSettings();
  }

  async function login() {
    const password = document.getElementById('password').value;
    const loginErr = document.getElementById('loginErr');
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        loginErr.classList.remove('show');
        showApp();
      } else {
        loginErr.textContent = 'Senha incorreta.';
        loginErr.classList.add('show');
      }
    } catch {
      loginErr.textContent = 'Não foi possível conectar ao servidor. Tente novamente em instantes.';
      loginErr.classList.add('show');
    }
  }

  async function logout() {
    await fetch('/api/admin/logout', { method: 'POST' });
    location.reload();
  }

  async function loadProducts() {
    try {
      const res = await fetch('/api/products');
      if (!res.ok) throw new Error('status ' + res.status);
      products = await res.json();
      renderList();
    } catch {
      toast('Não foi possível carregar os produtos. Recarregue a página.', true);
    }
  }

  function thumb(p, size) {
    const s = size || 44;
    if (p.image) return `<img src="${p.image}" alt="${p.name}" style="width:${s}px;height:${s}px;object-fit:cover;border-radius:${size?8:6}px"/>`;
    return `<div class="${size ? 'product-card-thumb-empty' : 'thumb-empty'}">${p.letter || '?'}</div>`;
  }

  function renderList() {
    const count = products.length;
    document.getElementById('productCount').textContent = count;
    document.getElementById('productsEmpty').style.display = count ? 'none' : 'block';

    // Mobile cards
    document.getElementById('productsCards').innerHTML = products.map(p => `
      <div class="product-card">
        ${thumb(p, 56)}
        <div class="product-card-info">
          <div class="product-card-name">${p.name}</div>
          <div class="product-card-meta">${CAT[p.category] || p.category} · ${p.material || ''}</div>
          <div class="product-card-price">R$ ${Number(p.price).toLocaleString('pt-BR')}
            ${p.featured ? '<span class="badge-featured" style="margin-left:.4rem">Destaque</span>' : ''}
          </div>
          <div class="product-card-actions">
            <button class="card-action-btn" onclick="editProduct('${p.id}')"><i class="ti ti-pencil"></i> Editar</button>
            <button class="card-action-btn danger" onclick="deleteProduct('${p.id}')"><i class="ti ti-trash"></i> Excluir</button>
          </div>
        </div>
      </div>
    `).join('');

    // Desktop table
    document.getElementById('productsTable').innerHTML = products.map(p => `
      <tr>
        <td>${thumb(p)}</td>
        <td>${p.name}</td>
        <td>${CAT[p.category] || p.category}</td>
        <td>R$ ${Number(p.price).toLocaleString('pt-BR')}</td>
        <td>${p.featured ? '<span class="badge-featured">Destaque</span>' : ''}</td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" onclick="editProduct('${p.id}')" aria-label="Editar"><i class="ti ti-pencil"></i></button>
            <button class="icon-btn danger" onclick="deleteProduct('${p.id}')" aria-label="Excluir"><i class="ti ti-trash"></i></button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function previewImage(input) {
    const preview = document.getElementById('imgPreview');
    if (input.files && input.files[0]) {
      preview.src = URL.createObjectURL(input.files[0]);
      preview.style.display = 'block';
    }
  }

  function editProduct(id) {
    // FIX: comparação por string para evitar falha de tipo (number vs string)
    const p = products.find(x => String(x.id) === String(id));
    if (!p) { toast('Produto não encontrado.', true); return; }
    document.getElementById('editId').value = p.id;
    document.getElementById('pName').value = p.name;
    document.getElementById('pMaterial').value = p.material || '';
    document.getElementById('pCategory').value = p.category;
    document.getElementById('pFeatured').checked = !!p.featured;
    document.getElementById('pPrice').value = p.price;
    document.getElementById('pOriginalPrice').value = p.originalPrice || '';
    const preview = document.getElementById('imgPreview');
    if (p.image) { preview.src = p.image.startsWith('/') ? p.image : '/' + p.image; preview.style.display = 'block'; }
    else { preview.style.display = 'none'; }
    document.getElementById('formTitle').textContent = 'Editar produto — ' + p.name;
    document.getElementById('submitBtn').textContent = 'Salvar alterações';
    document.getElementById('cancelBtn').style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    document.getElementById('productForm').reset();
    document.getElementById('editId').value = '';
    document.getElementById('imgPreview').style.display = 'none';
    document.getElementById('formTitle').textContent = 'Adicionar produto';
    document.getElementById('submitBtn').textContent = 'Adicionar produto';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  async function submitProduct(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const fd = new FormData();
    fd.append('name', document.getElementById('pName').value.trim());
    fd.append('material', document.getElementById('pMaterial').value.trim());
    fd.append('category', document.getElementById('pCategory').value);
    fd.append('featured', document.getElementById('pFeatured').checked);
    fd.append('price', document.getElementById('pPrice').value);
    fd.append('originalPrice', document.getElementById('pOriginalPrice').value || document.getElementById('pPrice').value);
    const file = document.getElementById('pImageFile').files[0];
    if (file) fd.append('imageFile', file);

    const url = id ? `/api/admin/products/${id}` : '/api/admin/products';
    const method = id ? 'PUT' : 'POST';
    const submitBtn = document.getElementById('submitBtn');
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando…';
    try {
      const res = await fetch(url, { method, body: fd });
      const data = await safeJson(res);
      if (!res.ok) throw new Error((data && data.error) || `Erro ao salvar (status ${res.status})`);
      toast(id ? 'Produto atualizado!' : 'Produto adicionado!');
      resetForm();
      loadProducts();
    } catch (err) {
      toast(connectionErrorMessage(err), true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }
    return false;
  }

  async function safeJson(res) {
    const text = await res.text();
    if (!text) return null;
    try { return JSON.parse(text); } catch { return null; }
  }

  function connectionErrorMessage(err) {
    if (err instanceof TypeError || /unexpected end of json|failed to fetch/i.test(err.message || '')) {
      return 'Servidor demorou pra responder (acordando). Aguarde e tente novamente.';
    }
    return err.message || 'Erro inesperado. Tente novamente.';
  }

  async function deleteProduct(id) {
    const p = products.find(x => String(x.id) === String(id));
    if (!confirm(`Excluir "${p ? p.name : id}"? Essa ação não pode ser desfeita.`)) return;
    try {
      const res = await fetch(`/api/admin/products/${id}`, { method: 'DELETE' });
      const data = await safeJson(res);
      if (!res.ok) throw new Error((data && data.error) || `Erro ao excluir (status ${res.status})`);
      toast('Produto excluído.');
      loadProducts();
    } catch (err) {
      toast(connectionErrorMessage(err), true);
    }
  }

  // ── configurações ──
  async function loadSettings() {
    try {
      const res = await fetch('/api/settings');
      const s = await res.json();
      document.getElementById('sWhatsapp').value    = s.whatsapp    || '';
      document.getElementById('sStoreName').value   = s.store_name  || '';
      document.getElementById('sStoreCity').value   = s.store_city  || '';
      document.getElementById('sStoreHours').value  = s.store_hours || '';
      document.getElementById('sStoreEmail').value  = s.store_email || '';
      document.getElementById('sInstagram').value   = s.instagram_url || '';
    } catch {
      toast('Não foi possível carregar as configurações.', true);
    }
  }

  async function saveSettings(e) {
    e.preventDefault();
    const btn = document.getElementById('settingsSubmitBtn');
    btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      const body = {
        whatsapp:      document.getElementById('sWhatsapp').value.replace(/\D/g, ''),
        store_name:    document.getElementById('sStoreName').value.trim(),
        store_city:    document.getElementById('sStoreCity').value.trim(),
        store_hours:   document.getElementById('sStoreHours').value.trim(),
        store_email:   document.getElementById('sStoreEmail').value.trim(),
        instagram_url: document.getElementById('sInstagram').value.trim(),
      };
      const res = await fetch('/api/admin/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await safeJson(res);
      if (!res.ok) throw new Error((data && data.error) || 'Erro ao salvar');
      toast('Configurações salvas! O site será atualizado em instantes.');
    } catch (err) {
      toast(connectionErrorMessage(err), true);
    } finally {
      btn.disabled = false; btn.textContent = 'Salvar configurações';
    }
    return false;
  }

  document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  checkAuth();
</script>
</body>
</html>
